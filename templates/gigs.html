<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Find Gigs</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        GigCooperative
    </div>

    <div class="nav-links">

        <a href="{{ url_for('index') }}">
            Home
        </a>

        <a href="{{ url_for('dashboard') }}">
            Dashboard
        </a>

    </div>

</nav>


<section class="section">

    <h1>
        Find Gigs
    </h1>


    <form
        method="GET"
        class="search-form"
    >

        <input
            type="text"
            name="search"
            placeholder="Search gigs or skills..."
            value="{{ search }}"
        >


        <select name="category">

            <option value="">
                All Categories
            </option>

            <option value="Technology">
                Technology
            </option>

            <option value="Design">
                Design
            </option>

            <option value="Writing">
                Writing
            </option>

            <option value="Marketing">
                Marketing
            </option>

            <option value="Delivery">
                Delivery
            </option>

            <option value="Cleaning">
                Cleaning
            </option>

            <option value="Repair">
                Repair
            </option>

            <option value="Education">
                Education
            </option>

        </select>


        <button
            type="submit"
            class="btn"
        >
            Search
        </button>

    </form>


    <div class="gig-grid">

        {% for gig in gigs %}

        <div class="gig-card">

            <span class="category">
                {{ gig["category"] }}
            </span>

            <h3>
                {{ gig["title"] }}
            </h3>

            <p>
                {{ gig["description"][:150] }}
            </p>

            <p>
                Skills:
                {{ gig["skills"] }}
            </p>

            <div class="gig-info">

                <span>
                    💰 ₹{{ gig["budget"] }}
                </span>

                <span>
                    📍 {{ gig["location"] }}
                </span>

            </div>

            <a
                href="{{ url_for(
                    'gig_details',
                    gig_id=gig['id']
                ) }}"
            >
                View Details →
            </a>

        </div>

        {% else %}

        <p>
            No gigs found.
        </p>

        {% endfor %}

    </div>

</section>

</body>

</html>
