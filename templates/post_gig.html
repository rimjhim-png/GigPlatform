<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Post Gig</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="form-container">

    <div class="form-box">

        <h1>
            Post a Gig
        </h1>

        <p>
            Find the right worker for your task.
        </p>


        <form method="POST">

            <label>
                Gig Title
            </label>

            <input
                type="text"
                name="title"
                placeholder="Example: Build a website"
                required
            >


            <label>
                Description
            </label>

            <textarea
                name="description"
                rows="5"
                required
            ></textarea>


            <label>
                Category
            </label>

            <select name="category">

                <option value="Technology">
                    Technology
                </option>

                <option value="Design">
                    Design
                </option>

                <option value="Writing">
                    Writing
                </option>

                <option value="Marketing">
                    Marketing
                </option>

                <option value="Delivery">
                    Delivery
                </option>

                <option value="Cleaning">
                    Cleaning
                </option>

                <option value="Repair">
                    Repair
                </option>

                <option value="Education">
                    Education
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label>
                Required Skills
            </label>

            <input
                type="text"
                name="skills"
                placeholder="Python, Flask, HTML"
                required
            >


            <label>
                Location
            </label>

            <input
                type="text"
                name="location"
                placeholder="Delhi / Remote"
                required
            >


            <label>
                Budget (₹)
            </label>

            <input
                type="number"
                name="budget"
                min="1"
                required
            >


            <label>
                Duration (days)
            </label>

            <input
                type="number"
                name="duration"
                min="1"
                required
            >


            <button
                type="submit"
                class="btn"
            >
                Publish Gig
            </button>

        </form>

    </div>

</div>

</body>

</html>
